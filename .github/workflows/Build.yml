name: Build & Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} | Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Package
        run: npm run build

      - name: Run Vitest Suite
        run: npm test

      - name: Verify Compatibility (Local Node)
        run: npm run test:compat

      - name: Upload Build Artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 1

  test-legacy-node:
    name: Legacy Compatibility (node:${{ matrix.node }}-alpine)
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['10', '12', '14', '16']
    container:
      image: node:${{ matrix.node }}-alpine

    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Install Production Dependencies Only
        run: npm install --production --ignore-scripts

      - name: Run Node ${{ matrix.node }} Compatibility Test
        run: node scripts/test-compat.cjs
